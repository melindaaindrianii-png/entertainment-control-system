{% extends 'base.html' %}{% block content %}<div class="header"><div><h1>New Entertainment Request</h1><p class="muted">Complete the form and submit for manager approval.</p></div><a href="{{url_for('member_dashboard')}}">← Back</a></div><form method="post" enctype="multipart/form-data" class="card"><div class="grid"><div><label>Entertainment Date *</label><input type="date" name="entertainment_date" required></div><div><label>Company *</label><input name="company" required placeholder="Company name"></div><div><label>Entertainment Place *</label><input name="place" required placeholder="Restaurant / venue"></div><div><label>Total Entertainment Amount (IDR) *</label><input type="number" name="amount" min="0" step="1000" required></div><div><label>Number of Entertained Persons *</label><input id="count" type="number" name="people_count" min="1" value="1" required></div></div><h2>Entertained Persons</h2><div id="people"></div><button type="button" class="secondary" onclick="addPerson()">+ Add Person</button><h2>Receipt</h2><input type="file" name="receipt" accept="image/jpeg,image/png,application/pdf" required><p class="muted">Max 8 MB. JPG, PNG, or PDF.</p><div class="actions"><button class="primary">Submit Request</button></div></form><script>let n=0;function addPerson(name='',level=''){n++;document.querySelector('#people').insertAdjacentHTML('beforeend',`<div class="person"><input name="person_name" placeholder="Name" value="${name}" required><input name="person_level" placeholder="Level (e.g. Director)" value="${level}"><button type="button" onclick="this.parentElement.remove()">Remove</button></div>`)}addPerson();document.querySelector('#count').addEventListener('change',e=>{let c=Math.max(1,+e.target.value||1),wrap=document.querySelector('#people');while(wrap.children.length<c)addPerson();while(wrap.children.length>c)wrap.lastElementChild.remove()});</script>{% endblock %}
