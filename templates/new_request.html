{% extends 'base.html' %}{% block content %}<div class="header"><div><h1>New Entertainment Request</h1><p class="muted">Complete the form and submit for manager approval.</p></div><a href="{{url_for('member_dashboard')}}">← Back</a></div><form method="post" enctype="multipart/form-data" class="card"><div class="grid"><div><label>Entertainment Date *</label><input type="date" name="entertainment_date" required></div><div><label>Company *</label><input name="company" required placeholder="Company name"></div><div><label>Purpose *</label><input name="purpose" required placeholder="Purpose of entertainment"></div><div><label>Entertainment Place *</label><input name="place" required placeholder="Restaurant / venue"></div><div><label>Cost Estimation (IDR) *</label><input type="number" name="cost_estimation" min="0" step="1000" required></div><div><label>Cost Actual (IDR) *</label><input type="number" name="cost_actual" min="0" step="1000" required></div><div><label>Number of Entertained Persons *</label><input id="count" type="number" name="people_count" min="1" max="10" value="1" required></div></div><h2>Entertained Persons</h2><p class="muted">Maximum 10 persons, matching the company entertainment format.</p><div id="people"></div><button type="button" class="secondary" onclick="addPerson()">+ Add Person</button><h2>Receipt</h2><input type="file" name="receipt" accept="image/jpeg,image/png,application/pdf" required><p class="muted">Max 8 MB. JPG, PNG, or PDF.</p><div class="actions"><button class="primary">Submit Request</button></div></form><script>let n=0;function addPerson(name='',level=''){if(n>=10)return;n++;document.querySelector('#people').insertAdjacentHTML('beforeend',`<div class="person"><span class="num">${n}.</span><input name="person_name" placeholder="Name" value="${name}" required><input name="person_level" placeholder="Level (e.g. Director)" value="${level}"><button type="button" onclick="removePerson(this)">Remove</button></div>`)}function removePerson(btn){btn.parentElement.remove();n--;document.querySelectorAll('#people .num').forEach((x,i)=>x.textContent=(i+1)+'.')}addPerson();document.querySelector('#count').addEventListener('change',e=>{let c=Math.min(10,Math.max(1,+e.target.value||1));e.target.value=c;let wrap=document.querySelector('#people');while(wrap.children.length<c)addPerson();while(wrap.children.length>c)wrap.lastElementChild.remove();document.querySelectorAll('#people .num').forEach((x,i)=>x.textContent=(i+1)+'.');n=wrap.children.length});</script>{% endblock %}
